{% extends 'base.html' %}{% block title %}Cambiar contraseña{% endblock %}{% block content %}<form class="panel formulario acceso" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><h1>Cambiar contraseña</h1>{% if g.usuario.debe_cambiar_password %}<p>Por seguridad debes reemplazar la contraseña temporal antes de continuar.</p>{% endif %}<div class="form-grid una-columna"><label>Contraseña actual<input type="password" name="actual" required></label><label>Nueva contraseña<input type="password" name="nueva" minlength="10" required><small>Mínimo 10 caracteres.</small></label><label>Confirmar nueva contraseña<input type="password" name="confirmacion" minlength="10" required></label></div><div class="acciones"><button class="boton">Guardar contraseña</button></div></form>{% endblock %}
