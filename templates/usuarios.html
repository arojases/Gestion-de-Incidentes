{% extends 'base.html' %}{% block title %}Usuarios{% endblock %}{% block content %}
<div class="encabezado"><div><h1>Usuarios</h1><p>Administra accesos y permisos.</p></div></div>
<form class="panel formulario" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><h2>Crear usuario</h2><div class="form-grid"><label>Usuario<input name="username" required maxlength="60"></label><label>Nombre completo<input name="nombre" required maxlength="120"></label><label>Rol<select name="rol">{% for valor, etiqueta in roles.items() %}<option value="{{ valor }}">{{ etiqueta }}</option>{% endfor %}</select></label><label>Contraseña temporal<input type="password" name="password" minlength="10" required><small>Deberá cambiarla al ingresar.</small></label></div><div class="acciones"><button class="boton">Crear usuario</button></div></form>
<section class="panel tabla-scroll"><table class="tabla-interactiva" data-page-size="10" data-search-placeholder="Filtrar usuarios..."><thead><tr><th>Usuario</th><th>Nombre</th><th>Último acceso</th><th data-no-sort>Permisos y estado</th></tr></thead><tbody>{% for u in usuarios %}<tr><td>{{ u.username }}</td><td>{{ u.nombre }}</td><td>{{ u.ultimo_acceso or 'Nunca' }}</td><td><form class="usuario-form" method="post" action="{{ url_for('actualizar_usuario', usuario_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><select name="rol">{% for valor, etiqueta in roles.items() %}<option value="{{ valor }}" {% if u.rol == valor %}selected{% endif %}>{{ etiqueta }}</option>{% endfor %}</select><label><input type="checkbox" name="activo" value="1" {% if u.activo %}checked{% endif %}> Activo</label><input type="password" name="password" minlength="10" placeholder="Nueva clave (opcional)"><button class="boton pequeno">Guardar</button></form></td></tr>{% endfor %}</tbody></table></section>
{% endblock %}
